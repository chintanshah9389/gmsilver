version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gm_silver_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gm_silver
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gm_silver_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - '3001:3001'
    depends_on:
      - postgres

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: gm_silver_admin
    restart: unless-stopped
    env_file:
      - ./admin-panel/.env
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
